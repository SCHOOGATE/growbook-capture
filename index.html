<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本の材料を送る</title>
<meta name="theme-color" content="#1f5f9e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="本の材料">
<style>
  :root{--bg:#f6f7f9;--fg:#222;--card:#fff;--line:#ccc;--sub:#555;--blue:#1f5f9e;--red:#c0392b;--red2:#7f1d1d;--ok:#1f7a4d}
  body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;padding:16px;background:var(--bg);color:var(--fg);max-width:560px;margin:0 auto}
  h1{font-size:20px;margin:4px 0 12px}
  label.t{display:block;font-size:14px;color:var(--sub);margin:14px 0 4px}
  select,input[type=text],textarea{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#222}
  textarea{height:80px}
  .btn{display:block;width:100%;box-sizing:border-box;padding:22px 0;font-size:20px;font-weight:bold;border:0;border-radius:16px;background:var(--blue);color:#fff;text-align:center;margin-top:12px;font-family:inherit;cursor:pointer}
  .rec{background:var(--red)}.rec.on{background:var(--red2)}
  .sub{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:14px 0;font-size:16px}
  .card{background:var(--card);border-radius:12px;padding:12px;margin-top:12px;font-size:15px;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.08);word-break:break-all}
  .ok{color:var(--ok);font-weight:bold}.ng{color:var(--red);font-weight:bold}.wait{color:#888}
  a{color:var(--blue)}
  .hint{font-size:13px;color:#666;margin:6px 4px 0;line-height:1.5}
  #timer{font-size:28px;text-align:center;margin-top:8px;font-variant-numeric:tabular-nums;min-height:1em}
  #setup{display:none}
  input[type=file]{display:none}
</style>
</head>
<body>
<h1>本の材料を送る</h1>

<div id="setup" class="card"><span class="ng">設定がまだです。</span><br>手順書にある「自分専用のリンク」を、このスマホの Chrome（iPhone は Safari）で一度開いてください。</div>

<div id="app">
  <label class="t" for="book">どの本の材料ですか</label>
  <select id="book"><option>未分類</option></select>
  <input id="newbook" type="text" placeholder="新しい本の名前（新しく作るときだけ）" style="margin-top:8px">

  <label class="t" for="memo">ひとことメモ（任意）</label>
  <textarea id="memo" placeholder="いつ・どこで・何の話か など"></textarea>

  <button class="btn rec" id="recbtn" type="button">🎙 録音をはじめる</button>
  <div id="timer"></div>

  <label class="btn sub" for="afile">録音ファイルを選ぶ</label>
  <input id="afile" type="file" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.webm">

  <label class="btn" for="cam">📷 写真を撮る</label>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <label class="btn sub" for="lib">写真から選ぶ（複数可）</label>
  <input id="lib" type="file" accept="image/*" multiple>

  <button class="btn sub" id="memobtn" type="button">メモだけ送る</button>
  <button class="btn sub" id="openroot" type="button">📂 保存先を開く（Googleドライブ）</button>
  <p class="hint">送り先は、あなた自身の Google ドライブ「GrowBookForge材料」フォルダだけです。</p>
  <div id="list"></div>
</div>

<script>
(function () {
  'use strict';
  var VERSION = 'capture-web v0.2.1';
  var CH = 2000000;           // base64 で約2MBずつ（4の倍数）
  var KEY = 'gb_cfg';

  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  // ---- 設定：自分専用リンク（#u=デプロイID&t=合言葉）を一度開くと、このスマホに覚える ----
  var cfg = null;
  (function () {
    var h = location.hash.replace(/^#/, ''), p = {};
    h.split('&').forEach(function (kv) { var a = kv.split('='); if (a[0]) p[a[0]] = decodeURIComponent(a[1] || ''); });
    if (/^[A-Za-z0-9_-]{20,}$/.test(p.u || '') && /^[A-Za-z0-9]{16,}$/.test(p.t || '')) {
      store(KEY, JSON.stringify({ u: p.u, t: p.t }));
      history.replaceState(null, '', location.pathname);   // 合言葉をアドレス欄に残さない
    }
    try { cfg = JSON.parse(store(KEY) || 'null'); } catch (e) { cfg = null; }
  })();
  if (!cfg) { $('setup').style.display = 'block'; $('app').style.display = 'none'; return; }
  var API = 'https://script.google.com/macros/s/' + cfg.u + '/exec';

  function api(action, body) {
    body = body || {}; body.t = cfg.t; body.action = action;
    // Content-Type を付けない＝text/plain の単純リクエスト（事前確認なしで Apps Script に届く）
    return fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('通信エラー ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || '失敗'); return j.data; });
  }

  function book() { var n = $('newbook').value.trim(); return n || $('book').value; }
  function card(msg) { var d = document.createElement('div'); d.className = 'card'; d.innerHTML = msg; var L = $('list'); L.insertBefore(d, L.firstChild); return d; }

  api('books').then(function (bs) {
    var s = $('book');
    bs.forEach(function (b) { if (b !== '未分類') { var o = document.createElement('option'); o.textContent = b; s.appendChild(o); } });
    var last = store('gb_book'); if (last) s.value = last;
  }).catch(function (e) { card('<span class=ng>つながりません（' + esc(e.message) + '）。電波を確かめて開き直してください</span>'); });

  function links(r) {
    var a = [];
    if (r.url) a.push('<a href="' + esc(r.url) + '" target="_blank" rel="noopener">このファイルを開く</a>');
    if (r.folderUrl) a.push('<a href="' + esc(r.folderUrl) + '" target="_blank" rel="noopener">入っているフォルダを開く</a>');
    return a.length ? '<br>' + a.join('　') : '';
  }

  $('openroot').addEventListener('click', function () {
    var w = window.open('about:blank', '_blank');
    api('root').then(function (u) { if (w) w.location = u; else location.href = u; })
      .catch(function (e) { if (w) w.close(); card('<span class=ng>開けませんでした（' + esc(e.message) + '）</span>'); });
  });

  function sid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function upload(b64, kind, mime, ext, label) {
    var bk = book(); store('gb_book', bk);
    var memo = $('memo').value, id = sid(), n = Math.ceil(b64.length / CH) || 1;
    var d = card('<span class=wait>' + label + '：送信中… 0/' + n + '</span>');
    var i = 0;
    function next() {
      if (i >= n) {
        return api('finish', { meta: { sid: id, n: n, book: bk, kind: kind, mime: mime, ext: ext, memo: memo } }).then(function (r) {
          d.innerHTML = '<div class=ok>' + label + 'を保存しました</div>' + esc(r.folder + '/' + r.name) + '<br>' + Math.round(r.size / 1024) + ' KB' + links(r);
        });
      }
      return api('chunk', { sid: id, idx: i, b64: b64.slice(i * CH, (i + 1) * CH) }).then(function () {
        i++; d.innerHTML = '<span class=wait>' + label + '：送信中… ' + i + '/' + n + '</span>'; return next();
      });
    }
    next().catch(function (e) { d.innerHTML = '<span class=ng>' + label + '：失敗しました（' + esc(e.message) + '）</span>'; });
  }

  function readB64(blob, cb) { var fr = new FileReader(); fr.onload = function () { cb(String(fr.result).split(',')[1] || ''); }; fr.readAsDataURL(blob); }
  function extOf(name, mime) {
    var m = /\.([a-z0-9]{2,5})$/i.exec(name || ''); if (m) return m[1].toLowerCase();
    if (/mp4|m4a|aac/.test(mime)) return 'm4a'; if (/webm/.test(mime)) return 'webm'; if (/ogg/.test(mime)) return 'ogg';
    if (/wav/.test(mime)) return 'wav'; if (/mpeg|mp3/.test(mime)) return 'mp3'; return 'bin';
  }
  function shrink(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 2400, w = im.width, h = im.height, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
      };
      im.onerror = function () { cb(String(fr.result).split(',')[1]); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function pickImg(ev) {
    var fs = ev.target.files;
    for (var k = 0; k < fs.length; k++) (function (f) { shrink(f, function (b) { upload(b, '写真', 'image/jpeg', 'jpg', '写真'); }); })(fs[k]);
    ev.target.value = '';
  }
  $('cam').addEventListener('change', pickImg);
  $('lib').addEventListener('change', pickImg);
  $('afile').addEventListener('change', function (ev) {
    var f = ev.target.files[0]; if (!f) return; var mime = f.type || 'audio/mp4';
    readB64(f, function (b) { upload(b, '音声', mime, extOf(f.name, mime), '音声'); }); ev.target.value = '';
  });

  // ---- 画面の中で録音 ----
  var rec = null, chunks = [], t0 = 0, tick = null;
  function pickMime() {
    var c = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
    for (var k = 0; k < c.length; k++) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[k])) return c[k];
    return '';
  }
  $('recbtn').addEventListener('click', function () {
    var b = $('recbtn');
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      card('<span class=ng>この画面では録音できません。Chrome（iPhone は Safari）で開き直すか、「録音ファイルを選ぶ」を使ってください</span>'); return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) {
      var mt = pickMime(); chunks = [];
      rec = mt ? new MediaRecorder(st, { mimeType: mt }) : new MediaRecorder(st);
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        clearInterval(tick); $('timer').textContent = ''; b.textContent = '🎙 録音をはじめる'; b.className = 'btn rec';
        st.getTracks().forEach(function (x) { x.stop(); });
        var mime = (rec.mimeType || mt || 'audio/mp4').split(';')[0];
        var blob = new Blob(chunks, { type: mime });
        if (!blob.size) { card('<span class=ng>録音が空でした。もう一度お試しください</span>'); return; }
        readB64(blob, function (x) { upload(x, '音声', mime, extOf('', mime), '録音'); });
      };
      rec.start(1000); t0 = Date.now(); b.textContent = '⏹ 録音をとめて送る'; b.className = 'btn rec on';
      tick = setInterval(function () { var s = Math.floor((Date.now() - t0) / 1000); $('timer').textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }, 500);
    }).catch(function (e) {
      card('<span class=ng>マイクが使えません（' + esc(e.name) + '）。アプリの中で開いている場合は、右上の「︙」から「Chromeで開く」（iPhone は Safari）を選んでください</span>');
    });
  });

  $('memobtn').addEventListener('click', function () {
    var m = $('memo').value.trim(); if (!m) { card('<span class=ng>メモが空です</span>'); return; }
    var d = card('<span class=wait>メモ：送信中…</span>');
    api('memo', { book: book(), memo: m }).then(function (r) {
      d.innerHTML = '<div class=ok>メモを保存しました</div>' + esc(r.folder + '/' + r.name) + links(r); $('memo').value = '';
    }).catch(function (e) { d.innerHTML = '<span class=ng>メモ：失敗しました（' + esc(e.message) + '）</span>'; });
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  window.GB_VERSION = VERSION;
})();
</script>
</body>
</html>
